name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      # Optional: native Google sign-in. Only enabled when google-services.json is in the repo root.
      - name: Enable native Google sign-in (if google-services.json exists)
        run: |
          if [ -f google-services.json ]; then
            echo "google-services.json found: adding Google sign-in plugin"
            if ! grep -q '"client_type": 1' google-services.json; then
              echo "::warning::google-services.json has no Android OAuth client. Add the SHA-1/SHA-256 in Firebase (Project settings > Android app), download google-services.json again and replace it, or Google sign-in will fail."
            fi
            npm install --no-save --legacy-peer-deps @capacitor-firebase/authentication@^8
          else
            echo "No google-services.json: Google sign-in disabled (email sign-in still works)"
          fi

      # Bundle the Firebase SDK inside the app so it starts fast and sign-in works with a weak connection
      - name: Bundle Firebase SDK into the app
        run: |
          mkdir -p www/vendor
          V=10.12.2
          if curl -fsSL "https://www.gstatic.com/firebasejs/$V/firebase-app-compat.js" -o www/vendor/firebase-app-compat.js \
             && curl -fsSL "https://www.gstatic.com/firebasejs/$V/firebase-auth-compat.js" -o www/vendor/firebase-auth-compat.js; then
            sed -i "s#https://www.gstatic.com/firebasejs/$V/#vendor/#g" www/index.html
            echo "Firebase SDK bundled"
          else
            echo "Download failed: app will load Firebase from the internet instead"
            rm -rf www/vendor
          fi

      - name: Create Android project
        run: npx cap add android

      - name: Add google-services.json
        run: |
          if [ -f google-services.json ]; then cp google-services.json android/app/google-services.json; fi

      - name: Allow camera for photo posts
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n</manifest>#' $M
          grep -n CAMERA $M

      - name: Generate app icons and splash screens
        run: npx capacitor-assets generate --android --assetPath assets || echo "Icon generation skipped (default icon used)"

      - name: Sync web files into the app
        run: npx cap sync android

      - name: Set version number
        run: |
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle || true
          sed -i "s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle || true

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Align and sign APK
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          UNSIGNED=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          "$BT/zipalign" -p -f 4 "$UNSIGNED" aligned.apk
          "$BT/apksigner" sign \
            --ks keystore/lamnian.jks --ks-key-alias lamnian \
            --ks-pass pass:lamnian-app --key-pass pass:lamnian-app \
            --out Lamnian.apk aligned.apk
          "$BT/apksigner" verify --verbose Lamnian.apk
          echo "Signing certificate:"
          keytool -printcert -jarfile Lamnian.apk | grep -E "SHA1|SHA256"

      - uses: actions/upload-artifact@v4
        with:
          name: Lamnian-apk
          path: Lamnian.apk

      - name: Attach APK to GitHub release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: Lamnian.apk
