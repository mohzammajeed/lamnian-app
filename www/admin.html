<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Lamnian Admin</title>
<link rel="icon" type="image/png" href="/icons/favicon-48.png">
<style>
body{margin:0;font:500 16px/1.5 system-ui,sans-serif;background:#eef3fb;color:#15302d}
.w{width:min(900px,100% - 32px);margin:0 auto;padding:24px 0}
h1{font:700 28px Georgia,serif;margin:0}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:14px 0}
button{border:1px solid #cfd8d3;background:#fff;border-radius:99px;padding:8px 16px;font:700 14px system-ui;cursor:pointer}
button.p{background:#2b7bd1;color:#fff;border-color:#2b7bd1}button.d{color:#b4331a}button.on{background:#2b7bd1;color:#fff}
.c{background:#fff;border:1px solid #dde3de;border-radius:16px;padding:16px;margin:12px 0;display:flex;gap:14px;flex-wrap:wrap}
.c img{width:140px;height:110px;object-fit:cover;border-radius:10px}.c .t{flex:1;min-width:200px}
.tag{background:#ecefe9;border-radius:99px;padding:2px 10px;font-size:12px;font-weight:800}
.m{color:#5d6f6c;font-size:13px}#login{text-align:center;padding:60px 0}
</style></head><body><div class="w">
<h1><img src="/icons/favicon-48.png" width="30" height="30" alt="" style="vertical-align:-6px;border-radius:8px"> Lamnian admin</h1>
<div id="login" hidden><p>Sign in with the admin Google account.</p><button class="p" id="in">Sign in with Google</button><p class="m" id="err"></p></div>
<div id="app" hidden>
  <div class="bar"><button id="tP" class="on">Posts</button><button id="tR">Reports</button><span style="flex:1"></span><span class="m" id="who"></span><button id="out">Sign out</button></div>
  <div id="list"></div>
</div></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
var firebaseConfig={apiKey:"AIzaSyBc2VA1OA3FfNw7qWTEzZauidFWuBcAdEQ",authDomain:"lamnian-ai.firebaseapp.com",projectId:"lamnian-ai",storageBucket:"lamnian-ai.firebasestorage.app",messagingSenderId:"90954222339",appId:"1:90954222339:web:92e8d710bd9c2f08973736"};
var ADMIN='mohzammajeed@gmail.com',COLS=['news','gallery','events','notices','directory'],pub=false;
firebase.initializeApp(firebaseConfig);var auth=firebase.auth(),db=firebase.firestore();
var $=function(s){return document.querySelector(s)},esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
$('#in').onclick=function(){auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(function(e){$('#err').textContent=e.message})};
$('#out').onclick=function(){auth.signOut()};
auth.onAuthStateChanged(function(u){
  var ok=u&&u.email===ADMIN&&u.emailVerified;
  if(u&&!ok){auth.signOut();$('#err').textContent='This account is not allowed.'}
  $('#login').hidden=!!ok;$('#app').hidden=!ok;
  if(ok){$('#who').textContent=u.email;load()}});
var tab='p';
$('#tP').onclick=function(){tab='p';$('#tP').className='on';$('#tR').className='';load()};
$('#tR').onclick=function(){tab='r';$('#tR').className='on';$('#tP').className='';load()};
function load(){if(tab==='r')loadReports();else loadPosts()}
function loadReports(){$('#list').innerHTML='<p class="m">Loading…</p>';
  db.collection('reports').get().then(function(s){var a=s.docs.map(function(d){return{id:d.id,d:d.data()}}).sort(function(x,y){return(y.d.created||'')>(x.d.created||'')?1:-1});
    $('#list').innerHTML=a.map(function(r,i){return'<div class="c"><div class="t"><span class="tag">'+esc(r.d.col)+'</span> <span class="m">'+esc(r.d.created||'')+'</span><h3 style="margin:6px 0">'+esc(r.d.title)+'</h3><div>Reason: <b>'+esc(r.d.reason)+'</b></div></div><div><button class="d" data-a="rp" data-i="'+i+'">Delete post</button> <button data-a="rd" data-i="'+i+'">Dismiss</button></div></div>'}).join('')||'<p class="m">No reports.</p>';
    $('#list').onclick=function(e){var b=e.target.closest('button');if(!b)return;var r=a[b.dataset.i],rr=db.collection('reports').doc(r.id);
      if(b.dataset.a==='rd')rr.delete().then(load).catch(function(x){alert(x.message)});
      else if(confirm('Delete the reported post?'))db.collection(r.d.col).doc(r.d.postId).delete().then(function(){return rr.delete()}).then(load).catch(function(x){alert(x.message)})}
  }).catch(function(x){$('#list').innerHTML='<p class="m">Error: '+esc(x.message)+'</p>'})}
function loadPosts(){$('#list').innerHTML='<p class="m">Loading…</p>';
  Promise.all(COLS.map(function(c){return db.collection(c).get().then(function(s){return s.docs.map(function(d){return{c:c,id:d.id,d:d.data()}})})})).then(function(r){
    var a=[].concat.apply([],r).sort(function(x,y){return(y.d.created||'')>(x.d.created||'')?1:-1});
    $('#list').innerHTML=a.map(function(p,i){var d=p.d;return'<div class="c">'+(/^data:image\//.test(d.image||'')?'<img alt="" src="'+d.image+'">':'')+'<div class="t"><span class="tag">'+p.c+'</span> <span class="m">'+esc(d.created||'')+'</span><h3 style="margin:6px 0">'+esc(d.title)+'</h3><div>'+esc(d.body)+'</div><div class="m">'+[d.author,d.cat,d.date,d.phone].filter(Boolean).map(esc).join(' · ')+'</div></div><div>'+'<button class="d" data-a="del" data-i="'+i+'">Delete</button></div></div>'}).join('')||'<p class="m">Nothing here.</p>';
    $('#list').onclick=function(e){var b=e.target.closest('button');if(!b)return;var p=a[b.dataset.i],ref=db.collection(p.c).doc(p.id);
      if(confirm('Delete this post permanently?'))ref.delete().then(load).catch(function(x){alert(x.message)})}
  }).catch(function(x){$('#list').innerHTML='<p class="m">Error: '+esc(x.message)+'</p>'})}
</script></body></html>
